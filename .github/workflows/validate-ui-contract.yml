name: Validate UI Contract

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-ui-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Check generated supported-features doc
        run: godot --headless --path . --script res://tools/ui_contract_cli.gd -- sync-docs --check

      - name: Validate smoke pack
        run: godot --headless --path . --script res://tools/ui_contract_cli.gd -- validate-smoke-pack
